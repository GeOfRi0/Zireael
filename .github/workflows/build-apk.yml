name: Zireael APK Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Birim Testleri ve Zireael v2.0.0 APK Üretimi
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Çek (Checkout)
        uses: actions/checkout@v4

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 8.9 Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Birim Testlerini Çalıştır
        run: gradle testDebugUnitTest --stacktrace

      - name: Zireael APK Derle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Zireael-v2.0.0.apk

      - name: APK Imza ve Paket Doğrulaması (Pre-Release Gate)
        run: |
          python3 -c '
          import zipfile, struct, sys
          apk = "app/build/outputs/apk/release/Zireael-v2.0.0.apk"
          with open(apk, "rb") as f:
              data = f.read()
          eocd = data.rfind(b"PK\x05\x06")
          cd_off = struct.unpack_from("<I", data, eocd + 16)[0]
          assert data[cd_off - 16 : cd_off] == b"APK Sig Block 42", "Missing APK Signature Scheme v2/v3!"
          with zipfile.ZipFile(apk, "r") as z:
              names = set(z.namelist())
              for req in ["AndroidManifest.xml", "classes.dex", "lib/arm64-v8a/libffmpegkit.so", "lib/arm64-v8a/libpython.zip.so", "lib/armeabi-v7a/libpython.zip.so"]:
                  assert req in names, f"Missing required entry: {req}"
          print("Release verification passed! Size:", round(len(data)/1024/1024, 2), "MB")
          '

      - name: APK Dosyasını Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Zireael-v2.0.0-apk
          path: app/build/outputs/apk/release/Zireael-v2.0.0.apk
          if-no-files-found: error

      - name: GitHub Release Yayınla (Etiket v* Geldiğinde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Zireael ${{ github.ref_name }}"
          generate_release_notes: true
          files: app/build/outputs/apk/release/Zireael-v2.0.0.apk
