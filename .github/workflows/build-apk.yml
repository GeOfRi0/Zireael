name: Zireael APK Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Birim Testleri ve Zireael v2.0.0 APK Üretimi
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Çek (Checkout)
        uses: actions/checkout@v4

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 8.9 Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Birim Testlerini Çalıştır
        run: gradle testDebugUnitTest --stacktrace

      - name: Zireael APK Derle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Zireael-v2.0.0.apk

      - name: APK Dosyasını Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Zireael-v2.0.0-apk
          path: app/build/outputs/apk/release/Zireael-v2.0.0.apk
          if-no-files-found: error

      - name: GitHub Release Yayınla (Etiket v* Geldiğinde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Zireael ${{ github.ref_name }}"
          generate_release_notes: true
          files: app/build/outputs/apk/release/Zireael-v2.0.0.apk
